# =============================================================================
# Release — build → testa a MESMA imagem → só então publica no GHCR
#
# A imagem é construída uma vez (load local), passa por scripts/test-image.sh
# e, somente se todos os cenários passarem, essa mesma imagem recebe as tags
# latest, sha-<7> e YYYYMMDD-HHMMSS e é enviada. Se um teste falhar, a :latest
# atual continua intocada.
# =============================================================================
name: Release (build, test, push to GHCR)

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile.trixie'
      - 'requirements.txt'
      - 'image/**'
      - '.github/workflows/build-push-ghcr.yml'

  # Manual trigger with optional tag suffix
  workflow_dispatch:
    inputs:
      tag_suffix:
        description: 'Optional tag suffix (e.g., -debug, -test)'
        required: false
        default: ''
        type: string

# Never run two releases at the same time; never cancel one halfway
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 🔄 Checkout code
        uses: actions/checkout@v7

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔑 Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Generate tags and labels
        id: meta
        env:
          TAG_SUFFIX: ${{ github.event.inputs.tag_suffix }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          TIMESTAMP="$(date -u +"%Y%m%d-%H%M%S")"
          IMAGE_NAME="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"

          {
            echo "image_name=${IMAGE_NAME}"
            echo "short_sha=${SHORT_SHA}"
            echo "timestamp=${TIMESTAMP}"
            echo "tag_suffix=${TAG_SUFFIX}"
          } >> "$GITHUB_OUTPUT"

      # 1) Build once, load into the local Docker daemon (nothing is pushed yet)
      - name: 🏗️ Build image (not pushed yet)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.trixie
          platforms: linux/amd64
          load: true
          push: false
          # Only a local tag here: the public tags are applied to this exact image
          # in the push step, after the quality gate (a `docker pull :latest` in
          # between can never overwrite the candidate)
          tags: rpa-worker:candidate
          build-args: |
            BUILD_PJEOFFICE=1
            ENABLE_PDF_TOOLS=1
            ENABLE_VNC=1
            ENABLE_NOVNC=1
            CHROME_PROFILE_URL=${{ secrets.CHROME_PROFILE_URL || '' }}
            SELENIUMBASE_REFRESH=${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.timestamp }}

      # 2) Quality gate on that exact image — a failure stops the release here
      - name: 🧪 Quality gate (scripts/test-image.sh)
        run: scripts/test-image.sh rpa-worker:candidate test-results

      # 3) What changes for production compared with the current :latest (informative)
      - name: 🔍 Diff against current :latest
        continue-on-error: true
        run: |
          docker pull -q "${{ steps.meta.outputs.image_name }}:latest" >/dev/null
          scripts/image-snapshot.sh "${{ steps.meta.outputs.image_name }}:latest" snapshots/current >/dev/null
          scripts/image-snapshot.sh rpa-worker:candidate snapshots/candidate >/dev/null
          {
            echo "### 🔍 Mudanças em relação à :latest atual"
            echo '```diff'
            diff -u snapshots/current/versions.txt snapshots/candidate/versions.txt | grep '^[-+][^-+]' || echo "(versões de browsers/drivers iguais)"
            diff -u snapshots/current/pip-freeze.txt snapshots/candidate/pip-freeze.txt | grep '^[-+][^-+]' || echo "(pip freeze igual)"
            echo "dpkg: $(diff snapshots/current/dpkg.txt snapshots/candidate/dpkg.txt | grep -c '^>') pacote(s) alterado(s)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 4) Publish the tested image (same bits, just re-tagged)
      - name: 🚀 Push tested image
        id: push
        env:
          IMAGE_NAME: ${{ steps.meta.outputs.image_name }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          TIMESTAMP: ${{ steps.meta.outputs.timestamp }}
          TAG_SUFFIX: ${{ steps.meta.outputs.tag_suffix }}
        run: |
          set -euo pipefail
          CANDIDATE_ID="$(docker image inspect --format '{{.Id}}' rpa-worker:candidate)"
          TAGS=("sha-${SHORT_SHA}${TAG_SUFFIX}" "${TIMESTAMP}${TAG_SUFFIX}" "latest${TAG_SUFFIX}")

          for tag in "${TAGS[@]}"; do
            docker tag rpa-worker:candidate "${IMAGE_NAME}:${tag}"
            # the tag must point at the tested image, nothing else
            test "$(docker image inspect --format '{{.Id}}' "${IMAGE_NAME}:${tag}")" = "$CANDIDATE_ID"
            docker push "${IMAGE_NAME}:${tag}"
          done

          # Verify on the registry: every tag must resolve to the same digest
          DIGEST="$(docker buildx imagetools inspect "${IMAGE_NAME}:sha-${SHORT_SHA}${TAG_SUFFIX}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          for tag in "${TAGS[@]}"; do
            got="$(docker buildx imagetools inspect "${IMAGE_NAME}:${tag}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
            echo "${tag} -> ${got}"
            if [ "$got" != "$DIGEST" ]; then
              echo "::error::${tag} aponta para ${got}, esperado ${DIGEST}"
              exit 1
            fi
          done
          echo "digest=${IMAGE_NAME}@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: 📊 Build Summary
        if: always()
        run: |
          cat test-results/summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          {
            echo ""
            echo "## 📦 Release"
            if [ -n "${{ steps.push.outputs.digest }}" ]; then
              echo "- **Publicado:** \`${{ steps.push.outputs.digest }}\`"
              echo "- **Tags:** \`latest${{ steps.meta.outputs.tag_suffix }}\`, \`sha-${{ steps.meta.outputs.short_sha }}${{ steps.meta.outputs.tag_suffix }}\`, \`${{ steps.meta.outputs.timestamp }}${{ steps.meta.outputs.tag_suffix }}\`"
              echo ""
              echo '```bash'
              echo "docker pull ${{ steps.meta.outputs.image_name }}:latest${{ steps.meta.outputs.tag_suffix }}"
              echo '```'
            else
              echo "- ❌ **Nada foi publicado**: a \`:latest\` atual continua em produção."
            fi
            echo "- Build-args: \`BUILD_PJEOFFICE=1 ENABLE_PDF_TOOLS=1 ENABLE_VNC=1 ENABLE_NOVNC=1 SELENIUMBASE_REFRESH=${{ github.run_id }}\`"
            echo "- \`CHROME_PROFILE_URL\`: ${{ secrets.CHROME_PROFILE_URL != '' && '[SET]' || '[NOT SET]' }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 📁 Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-test-results
          path: test-results/
          retention-days: 14

  cleanup:
    needs: build-and-push
    runs-on: ubuntu-latest
    concurrency:
      group: cleanup-images
    permissions:
      packages: write

    steps:
      - name: Cleanup old GHCR images
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          packages: 'rpa-worker-selenium'
          keep-n-tagged: 5
          exclude-tags: 'latest,prod,production,stable,deploy-*'
          delete-untagged: false
          dry-run: false
