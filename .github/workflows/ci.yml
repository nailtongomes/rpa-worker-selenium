# =============================================================================
# CI — roda em todo PR (e em push na main)
#
#   unit-tests  pytest no host, sem Docker (~1 min)
#   image       build IDÊNTICO ao do release + scripts/test-image.sh (bloqueante),
#               em amd64 (:latest) e arm64 (:latest-arm64, runner ARM nativo)
#               + auditoria ClearCote de fingerprint (informativa, só amd64)
#
# O mesmo scripts/test-image.sh é o portão do release (build-push-ghcr.yml).
# =============================================================================
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest

  image:
    needs: unit-tests
    name: image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            cache: buildkit          # escopo de cache de sempre (amd64)
          - arch: arm64
            runner: ubuntu-24.04-arm # ARM nativo, sem emulação
            cache: buildkit-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Same build-args as the release (see build-push-ghcr.yml)
      - name: Build image (production build-args)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.trixie
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: rpa-worker:ci
          build-args: |
            BUILD_PJEOFFICE=1
            ENABLE_PDF_TOOLS=1
            ENABLE_VNC=1
            ENABLE_NOVNC=1
          cache-from: type=gha,scope=${{ matrix.cache }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache }}

      - name: Quality gate (scripts/test-image.sh)
        run: scripts/test-image.sh rpa-worker:ci test-results

      - name: Test summary
        if: always()
        run: cat test-results/summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      # Informative only: depends on an external site and a score, never blocks
      - name: ClearCote fingerprint audit (informative)
        if: success() && matrix.arch == 'amd64'
        continue-on-error: true
        run: |
          mkdir -p test-results/clearcote && chmod 777 test-results/clearcote
          docker run --rm --shm-size=2g -e USE_XVFB=1 -e USE_OPENBOX=1 \
            -v "$(pwd)/test-results/clearcote:/app/downloaded_files" \
            rpa-worker:ci bash -c "sleep 3 && python /app/smoke_test_clearcote.py" \
            | tee test-results/clearcote/output.log
          SCORE="$(grep -oE 'CLEARCOTE_SCORE=[0-9]+' test-results/clearcote/output.log | tail -1 | cut -d= -f2)"
          {
            echo "### 🕵️ ClearCote (informativo)"
            echo "- Score: **${SCORE:-n/d}/100**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-test-results-${{ matrix.arch }}
          path: test-results/
          retention-days: 7
