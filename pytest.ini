[pytest]
# Configuração do pytest para o rpa-worker-selenium
#
#   pytest                      -> testes unitários (host, sem Docker, segundos)
#   pytest tests/image          -> testes da imagem (rodar DENTRO do container)

testpaths = tests/unit
pythonpath = image/app tests

python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

markers =
    integration: Integration tests
    trixie: Trixie-specific tests
    slow: Slow-running tests
    requires_display: Tests that require X11 display
    requires_cert: Tests that require A1 certificate

addopts =
    -ra
    --strict-markers
    --tb=short

# Requer pytest-timeout (já incluso na imagem e em requirements-dev.txt)
timeout = 300

minversion = 8.0
